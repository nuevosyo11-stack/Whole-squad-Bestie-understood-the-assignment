  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 20px 14px 40px;
    }

    .page {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    .title {
      text-align: center;
      margin: 4px 0 16px;
      font-size: clamp(20px, 4vw, 30px);
      font-weight: 700;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: #000;
      box-shadow: 0 12px 40px rgba(0,0,0,.55);
    }

    video {
      display: block;
      width: 100%;
      max-height: 78vh;
      background: #000;
      object-fit: contain;
    }

    .popup-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.72);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .2s ease, visibility .2s ease;
    }

    .popup-overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .popup {
      width: min(360px, 100%);
      padding: 25px 22px;
      text-align: center;
      background: #111;
      border: 1px solid #303030;
      border-radius: 16px;
      box-shadow: 0 18px 55px rgba(0,0,0,.7);
    }

    .popup h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .popup p {
      margin: 0 0 20px;
      color: #c7c7c7;
      line-height: 1.5;
      font-size: 14px;
    }

    .continue-btn {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 10px;
      background: #e50914;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
    }

    .continue-btn:hover {
      background: #ff1b26;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 13px 16px;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      text-align: center;
    }

    .watch-btn {
      background: #e50914;
    }

    .download-btn {
      background: #202020;
      border: 1px solid #3a3a3a;
    }

    .note {
      margin-top: 12px;
      text-align: center;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px 10px 28px;
      }

      .video-wrap {
        border-radius: 10px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .action-btn {
        min-height: 48px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="title">Watch & Discover</div>

    <div class="video-wrap">
      <video
        id="video"
        autoplay
        muted
        playsinline
        controls
        preload="metadata"
      >
        <source
          src="https://cdn.videy.co/KUcavjzc1.mp4"
          type="video/mp4"
        >
        Tu navegador no puede reproducir este video.
      </video>

      <!-- Popup centrado DENTRO del video -->
      <div class="popup-overlay" id="continuePopup" aria-hidden="true">
        <div class="popup">
          <h2>Continue Watching?</h2>
          <p>Press continue to keep watching the full video 👀</p>

          <a
            class="continue-btn"
            href="https://sixstale.com/qxsczqqp?key=814cfc1b9f8fca23b6b1b6abe1e062e6"
            rel="nofollow noopener noreferrer"
          >
            ▶ Continue
          </a>
        </div>
      </div>
    </div>

    <div class="buttons">
      <a
        class="action-btn watch-btn"
        href="https://sixstale.com/qxsczqqp?key=814cfc1b9f8fca23b6b1b6abe1e062e6"
        rel="nofollow noopener noreferrer"
      >
        ▶ Watch Full Video Here
      </a>

      <a
        class="action-btn download-btn"
        href="https://sixstale.com/qxsczqqp?key=814cfc1b9f8fca23b6b1b6abe1e062e6"
        download
        rel="noopener noreferrer"
      >
        ⬇ Download Video Here
      </a>
    </div>

    <div class="note">18+ • Please continue only if you are of legal age.</div>
  </main>

  <script>
    const video = document.getElementById("video");
    const popup = document.getElementById("continuePopup");

    const POPUP_SECONDS = 10;
    let popupShown = false;

    video.addEventListener("timeupdate", () => {
      if (!popupShown && video.currentTime >= POPUP_SECONDS) {
        popupShown = true;

        video.currentTime = POPUP_SECONDS;
        video.pause();

        popup.classList.add("show");
        popup.setAttribute("aria-hidden", "false");
      }
    });
  </script>
</body>
